<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Documentation for Ezeh Start, a Laravel 13 + Livewire 4 starter kit with a written house style."
    />
    <title>Ezeh Start Docs</title>
    <link rel="icon" type="image/png" href="/src/favicon.png" />
    <script>
      // Set the theme before first paint so the page never flashes the wrong one.
      try {
        const saved = localStorage.getItem('ezs-theme');
        const dark = saved ? saved === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.classList.toggle('dark', dark);
      } catch (e) {}
    </script>
    <script type="module" src="/src/main.js"></script>
  </head>
  <body>
    <div x-data="docsApp()" x-init="boot()" @keydown.window="shortcut($event)" class="min-h-screen">
      <!-- Top bar -->
      <header class="sticky top-0 z-40 border-b border-line bg-page/85 backdrop-blur-xl">
        <div class="mx-auto flex h-14 max-w-[90rem] items-center gap-3 px-4 sm:px-6">
          <button type="button" class="icon-btn lg:hidden" @click="navOpen = true" aria-label="Open navigation">
            <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8"><path stroke-linecap="round" d="M4 7h16M4 12h16M4 17h16" /></svg>
          </button>

          <a href="#/" class="flex items-center gap-2.5 font-semibold tracking-tight">
            <img src="/src/logo.png" alt="Ezeh Start" class="w-24 dark:hidden" />
            <img src="/src/logo-white.png" alt="Ezeh Start" class="hidden w-24 dark:block" />
            <span class="hidden rounded-md border border-line px-1.5 py-0.5 text-[11px] font-medium text-muted sm:inline">docs</span>
          </a>

          <div class="ml-auto flex items-center gap-2">
            <button
              type="button"
              @click="openSearch()"
              class="flex h-9 items-center gap-2 rounded-lg border border-line bg-panel px-3 text-sm text-muted transition hover:border-accent sm:w-64"
            >
              <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7" /><path stroke-linecap="round" d="m20 20-3.5-3.5" /></svg>
              <span class="hidden sm:inline">Search the docs</span>
              <kbd class="ml-auto hidden rounded border border-line px-1.5 text-[11px] sm:inline">/</kbd>
            </button>
            <button type="button" class="icon-btn" @click="toggleTheme()" aria-label="Toggle colour theme">
              <svg x-show="!dark" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8"><path stroke-linecap="round" stroke-linejoin="round" d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z" /></svg>
              <svg x-show="dark" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="4" /><path stroke-linecap="round" d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" /></svg>
            </button>
          </div>
        </div>
      </header>

      <div class="mx-auto flex max-w-[90rem]">
        <!-- Sidebar: static on desktop, a drawer on mobile -->
        <div
          x-show="navOpen"
          x-transition.opacity
          class="fixed inset-0 z-40 bg-black/40 lg:hidden"
          @click="navOpen = false"
          style="display: none"
        ></div>
        <aside
          :class="navOpen ? 'translate-x-0' : '-translate-x-full lg:translate-x-0'"
          class="fixed inset-y-0 left-0 z-50 w-72 -translate-x-full overflow-y-auto border-r border-line bg-page px-4 pb-10 pt-5 transition-transform lg:sticky lg:top-14 lg:z-0 lg:h-[calc(100vh-3.5rem)] lg:w-64 lg:shrink-0 lg:translate-x-0 lg:pt-8"
        >
          <div class="mb-4 flex items-center justify-between lg:hidden">
            <span class="font-semibold">Contents</span>
            <button type="button" class="icon-btn" @click="navOpen = false" aria-label="Close navigation">
              <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8"><path stroke-linecap="round" d="M6 18 18 6M6 6l12 12" /></svg>
            </button>
          </div>
          <nav class="space-y-7 text-sm">
            <template x-for="group in nav" :key="group.title">
              <div>
                <p class="mb-2 px-2 text-xs font-semibold uppercase tracking-wider text-muted" x-text="group.title"></p>
                <ul class="space-y-0.5">
                  <template x-for="item in group.pages" :key="item.slug">
                    <li>
                      <a
                        :href="'#/' + item.slug"
                        @click="navOpen = false"
                        :class="current.slug === item.slug ? 'nav-link nav-link-active' : 'nav-link'"
                        x-text="item.title"
                      ></a>
                    </li>
                  </template>
                </ul>
              </div>
            </template>
          </nav>
        </aside>

        <!-- Article -->
        <main class="min-w-0 flex-1 px-4 pb-24 pt-8 sm:px-8 lg:px-12">
          <div class="mx-auto flex max-w-5xl gap-12">
            <article class="min-w-0 max-w-3xl flex-1">
              <p class="mb-2 text-sm font-medium text-accent-ink" x-text="current.group"></p>
              <div class="doc" x-ref="doc" x-html="current.html"></div>

              <nav class="mt-16 grid gap-4 border-t border-line pt-8 sm:grid-cols-2">
                <div>
                  <a x-show="prev" :href="prev ? '#/' + prev.slug : '#/'" class="pager">
                    <span class="text-xs text-muted">Previous</span>
                    <span class="font-medium" x-text="prev?.title"></span>
                  </a>
                </div>
                <div>
                  <a x-show="next" :href="next ? '#/' + next.slug : '#/'" class="pager text-right">
                    <span class="text-xs text-muted">Next</span>
                    <span class="font-medium" x-text="next?.title"></span>
                  </a>
                </div>
              </nav>

              <footer class="mt-12 text-xs leading-6 text-muted">
                <p>
                  Ezeh Start code is released under the <a href="#/license" class="underline hover:text-fg">MIT License</a>.
                  “Ezeh Start” and the Ezeh Start logo are trademarks of Kingsley Uchenna Ezeh — see the
                  <a href="#/trademark" class="underline hover:text-fg">trademark policy</a>.
                </p>
              </footer>
            </article>

            <!-- On this page -->
            <aside class="hidden w-52 shrink-0 xl:block">
              <div class="sticky top-22" x-show="toc.length">
                <p class="mb-3 text-xs font-semibold uppercase tracking-wider text-muted">On this page</p>
                <ul class="space-y-2 border-l border-line text-sm">
                  <template x-for="h in toc" :key="h.id">
                    <li>
                      <a
                        :href="'#/' + current.slug + '/' + h.id"
                        :class="activeHeading === h.id ? 'toc-link toc-link-active' : 'toc-link'"
                        x-text="h.text"
                      ></a>
                    </li>
                  </template>
                </ul>
              </div>
            </aside>
          </div>
        </main>
      </div>

      <!-- Search -->
      <div
        x-show="searchOpen"
        x-transition.opacity
        class="fixed inset-0 z-50 flex items-start justify-center bg-black/50 px-4 pt-[12vh]"
        @click.self="searchOpen = false"
        style="display: none"
      >
        <div class="w-full max-w-xl overflow-hidden rounded-2xl border border-line bg-page shadow-2xl" @keydown.escape="searchOpen = false">
          <div class="flex items-center gap-3 border-b border-line px-4">
            <svg class="h-5 w-5 shrink-0 text-muted" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7" /><path stroke-linecap="round" d="m20 20-3.5-3.5" /></svg>
            <input
              x-ref="search"
              x-model="query"
              @input="resultIndex = 0"
              @keydown.arrow-down.prevent="moveResult(1)"
              @keydown.arrow-up.prevent="moveResult(-1)"
              @keydown.enter.prevent="pickResult()"
              type="search"
              placeholder="Search: passkeys, impersonation, trademark…"
              class="h-14 w-full bg-transparent text-base outline-none placeholder:text-muted"
            />
          </div>
          <ul class="max-h-[50vh] overflow-y-auto p-2">
            <template x-for="(r, i) in results" :key="r.slug">
              <li>
                <a
                  :href="'#/' + r.slug"
                  @click="searchOpen = false"
                  @mouseenter="resultIndex = i"
                  :class="resultIndex === i ? 'bg-accent-soft' : ''"
                  class="block rounded-lg px-3 py-2.5"
                >
                  <span class="block text-sm font-medium" x-text="r.title"></span>
                  <span class="block truncate text-xs text-muted" x-text="r.snippet"></span>
                </a>
              </li>
            </template>
            <li x-show="query && !results.length" class="px-3 py-6 text-center text-sm text-muted">Nothing matches that.</li>
            <li x-show="!query" class="px-3 py-6 text-center text-sm text-muted">Type to search every page.</li>
          </ul>
        </div>
      </div>
    </div>
  </body>
</html>
